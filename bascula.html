<title>Báscula · tu diario de comidas</title>
<style>
  :root{
    --bg:#EEF1EC;
    --surface:#FFFFFF;
    --surface-2:#F6F8F4;
    --ink:#17211E;
    --ink-soft:#5C6762;
    --ink-faint:#8A938E;
    --line:#E1E7DE;
    --teal:#12564C;
    --teal-deep:#0C3D36;
    --teal-tint:#E6EFEA;
    --honey:#E39A2E;
    --honey-deep:#BE7C15;
    --honey-tint:#FBF0DC;
    --danger:#C5453A;
    --danger-tint:#FBE7E4;
    --shadow:0 1px 2px rgba(23,33,30,.05), 0 6px 20px rgba(23,33,30,.06);
    --radius:18px;
    font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;font-size:1rem;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;}

  /* ---------- Onboarding ---------- */
  .ob{padding:28px 22px 120px;}
  .ob__brand{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .ob__logo{width:34px;height:34px;border-radius:10px;background:var(--teal);display:grid;place-items:center;color:#fff;font-weight:800;}
  .ob__brandname{font-weight:800;letter-spacing:-.02em;font-size:1.05rem;}
  .ob__h1{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:26px 0 8px;}
  .ob__lead{color:var(--ink-soft);font-size:1.02rem;margin:0 0 4px;}
  .ob__steplabel{margin-top:28px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700;}
  .field{margin-top:16px;}
  .field__label{display:block;font-size:.9rem;font-weight:600;margin-bottom:7px;color:var(--ink);}
  .field__hint{font-size:.82rem;color:var(--ink-faint);margin-top:6px;}
  .control{
    width:100%;padding:14px 15px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:1.05rem;outline:none;transition:border-color .15s;
  }
  .control:focus{border-color:var(--teal);}
  select.control{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235C6762' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .segment{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .seg{padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:.95rem;font-weight:600;color:var(--ink-soft);flex:1;text-align:center;min-width:64px;transition:all .15s;}
  .seg--on{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-deep);}
  .choicecard{display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;margin-top:10px;transition:all .15s;}
  .choicecard--on{border-color:var(--teal);background:var(--teal-tint);}
  .choicecard__t{font-weight:700;font-size:1rem;}
  .choicecard__s{font-size:.86rem;color:var(--ink-soft);}
  .cta{position:fixed;left:0;right:0;bottom:0;padding:14px 22px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);max-width:520px;margin:0 auto;}
  .btn{width:100%;padding:16px;border-radius:15px;background:var(--teal);color:#fff;font-weight:700;font-size:1.05rem;letter-spacing:-.01em;box-shadow:var(--shadow);transition:transform .08s,background .15s;}
  .btn:active{transform:scale(.985);}
  .btn:disabled{background:#B7C2BC;box-shadow:none;}
  .btn--ghost{background:var(--surface);color:var(--teal-deep);border:1.5px solid var(--line);box-shadow:none;}
  .btn--danger-ghost{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger-tint);box-shadow:none;}
  .btn--honey{background:var(--honey);}
  .btn--sm{width:auto;padding:11px 16px;font-size:.95rem;border-radius:12px;}

  .callout{margin-top:18px;padding:14px 15px;border-radius:14px;background:var(--honey-tint);border:1px solid #F0DFB8;font-size:.9rem;color:#7A5410;}
  .callout--teal{background:var(--teal-tint);border-color:#CBE0D6;color:var(--teal-deep);}
  .callout--danger{background:var(--danger-tint);border-color:#F1C9C4;color:#8F291F;}
  .callout strong{font-weight:800;}

  /* result preview in onboarding */
  .resultbox{margin-top:18px;background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .resultbox__big{font-size:3rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--teal-deep);}
  .resultbox__big span{font-size:1rem;font-weight:600;color:var(--ink-soft);letter-spacing:0;}
  .minigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
  .mini{background:var(--surface-2);border-radius:12px;padding:11px;text-align:center;}
  .mini__v{font-weight:800;font-size:1.15rem;}
  .mini__l{font-size:.72rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  .mini--prot .mini__v{color:var(--teal);}
  .mini--carb .mini__v{color:var(--honey-deep);}
  .mini--fat .mini__v{color:#8A6BB0;}

  /* ---------- Main app ---------- */
  .screen{display:none;padding:20px 18px 108px;}
  .screen--on{display:block;animation:fade .28s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .topbar__date{font-size:.82rem;color:var(--ink-faint);text-transform:capitalize;}
  .topbar__title{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;}

  /* Hero energy meter */
  .hero{background:var(--surface);border-radius:22px;padding:22px 20px 20px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden;}
  .hero__label{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);font-weight:700;}
  .hero__num{font-size:3.6rem;font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:4px;transition:color .3s;}
  .hero__num small{font-size:1.05rem;font-weight:600;letter-spacing:0;color:var(--ink-soft);margin-left:4px;}
  .hero--good .hero__num{color:var(--teal-deep);}
  .hero--warn .hero__num{color:var(--honey-deep);}
  .hero--over .hero__num{color:var(--danger);}
  .fuel{height:12px;border-radius:8px;background:var(--surface-2);margin-top:16px;overflow:hidden;position:relative;}
  .fuel__bar{height:100%;border-radius:8px;background:var(--teal);width:0;transition:width .5s cubic-bezier(.22,1,.36,1);}
  .hero--warn .fuel__bar{background:var(--honey);}
  .hero--over .fuel__bar{background:var(--danger);}
  .hero__sub{display:flex;justify-content:space-between;margin-top:10px;font-size:.84rem;color:var(--ink-soft);}
  .hero__sub b{color:var(--ink);font-weight:700;}

  .statusbanner{margin-top:14px;padding:13px 15px;border-radius:14px;font-size:.92rem;font-weight:600;display:flex;gap:9px;align-items:flex-start;}
  .statusbanner--good{background:var(--teal-tint);color:var(--teal-deep);}
  .statusbanner--warn{background:var(--honey-tint);color:#7A5410;}
  .statusbanner--over{background:var(--danger-tint);color:#8F291F;}
  .statusbanner__i{font-size:1.05rem;line-height:1.3;}

  /* Macro gauges */
  .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px;}
  .macro{background:var(--surface);border-radius:16px;padding:14px 12px;box-shadow:var(--shadow);}
  .macro__top{display:flex;justify-content:space-between;align-items:baseline;}
  .macro__name{font-size:.8rem;font-weight:700;color:var(--ink-soft);}
  .macro__val{font-size:1.15rem;font-weight:800;}
  .macro__val small{font-size:.72rem;color:var(--ink-faint);font-weight:600;}
  .macro__track{height:7px;border-radius:5px;background:var(--surface-2);margin-top:9px;overflow:hidden;}
  .macro__fill{height:100%;border-radius:5px;width:0;transition:width .5s cubic-bezier(.22,1,.36,1);}
  .macro--prot .macro__fill{background:var(--teal);}
  .macro--carb .macro__fill{background:var(--honey);}
  .macro--fat .macro__fill{background:#8A6BB0;}
  .macro--prot .macro__val{color:var(--teal);}
  .macro--carb .macro__val{color:var(--honey-deep);}
  .macro--fat .macro__val{color:#7256A0;}
  .macro__over{color:var(--danger)!important;}

  .sectionhead{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px;}
  .sectionhead__t{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;}
  .link{color:var(--teal);font-weight:700;font-size:.9rem;}

  /* Food entries */
  .entry{background:var(--surface);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:11px;display:flex;gap:13px;align-items:center;}
  .entry__thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .entry__thumb--icon{display:grid;place-items:center;font-size:1.4rem;}
  .entry__body{flex:1;min-width:0;}
  .entry__name{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry__macros{font-size:.8rem;color:var(--ink-soft);margin-top:2px;}
  .entry__kcal{font-weight:800;font-size:1.05rem;text-align:right;white-space:nowrap;}
  .entry__kcal small{display:block;font-size:.68rem;color:var(--ink-faint);font-weight:600;}
  .entry__del{color:var(--ink-faint);padding:6px;font-size:1.1rem;}
  .empty{text-align:center;color:var(--ink-faint);padding:34px 20px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);}
  .empty__i{font-size:2rem;}
  .empty__t{font-weight:700;color:var(--ink-soft);margin-top:8px;}
  .empty__s{font-size:.88rem;margin-top:4px;}

  /* Drinks quick-add */
  .drinks{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .drink{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:15px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow);transition:transform .08s,border-color .15s;}
  .drink:active{transform:scale(.96);border-color:var(--honey);}
  .drink__icon{font-size:1.7rem;line-height:1;}
  .drink__name{font-weight:800;font-size:.98rem;}
  .drink__kcal{font-size:.8rem;color:var(--ink-soft);font-weight:600;}
  .drink__count{position:absolute;top:8px;right:10px;min-width:22px;height:22px;padding:0 6px;border-radius:12px;background:var(--honey);color:#fff;font-size:.8rem;font-weight:800;display:grid;place-items:center;}
  .drinks__note{font-size:.8rem;color:var(--ink-faint);margin-top:10px;line-height:1.5;padding:0 2px;}

  /* Add screen */
  .dropzone{background:var(--surface);border:2px dashed var(--line);border-radius:20px;padding:32px 20px;text-align:center;box-shadow:var(--shadow);}
  .dropzone__i{font-size:2.4rem;}
  .dropzone__t{font-weight:800;font-size:1.1rem;margin-top:8px;letter-spacing:-.02em;}
  .dropzone__s{font-size:.9rem;color:var(--ink-soft);margin-top:4px;}
  .addbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .preview{margin-top:16px;background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);}
  .preview__img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;}
  .spinner{width:22px;height:22px;border:3px solid var(--teal-tint);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Suggestions */
  .sugcard{background:var(--surface);border-radius:16px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px;}

  .sugcard__tags{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;}

  .card{background:var(--surface);border-radius:18px;padding:18px 16px;box-shadow:var(--shadow);margin-bottom:14px;}

  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem;}
  .kv:last-child{border-bottom:none;}
  .kv__k{color:var(--ink-soft);}
  .kv__v{font-weight:700;}
  .weighrow{display:flex;gap:10px;margin-top:6px;}
  .weighrow .control{flex:1;}
  #weightChart{width:100%;height:150px;display:block;margin-top:6px;}

  /* Semana */
  .week__bars{position:relative;display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:4px;}
  .week__col{flex:1;display:flex;justify-content:center;align-items:flex-end;height:100%;}

  /* Bottom nav */

  .nav__item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--ink-faint);font-size:.68rem;font-weight:700;}

  .nav__item--on{color:var(--teal);}

  .nav__addbtn{width:52px;height:52px;border-radius:16px;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(18,86,76,.35);}
  .nav__addbtn svg{width:26px;height:26px;stroke-width:2.4;}

  .hidden{display:none!important;}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:all .3s;z-index:100;max-width:90%;text-align:center;pointer-events:none;}
  .toast--show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Báscula — diario de comidas con estimación por foto (IA)
   Un solo archivo. Persistencia: window.storage + memoria.
   ============================================================ */

/* ---------- Almacenamiento robusto ----------
   Prioridad de guardado:
   1) window.storage  → persiste entre sesiones DENTRO de Claude
   2) localStorage    → persiste en el dispositivo cuando la instalas en el iPhone
   3) memoria         → último recurso (no sobrevive al cierre)
   Todo va protegido con try/catch: si un backend no está o lanza error,
   se pasa al siguiente sin romper la app. */
const _mem = {};
const LS_PREFIX = 'bascula:';

// ¿Existe window.storage (entorno Claude)?
const HAS_WS = (typeof window !== 'undefined' && typeof window.storage !== 'undefined' && window.storage);

// ¿Está disponible localStorage? (puede lanzar en iframes restringidos)
let LS = null;
try{
  const t = '__ls_test__';
  window.localStorage.setItem(t, '1');
  window.localStorage.removeItem(t);
  LS = window.localStorage;
}catch(e){ LS = null; }

const store = {
  async get(k){
    if(HAS_WS){
      try{ const r = await window.storage.get(k, false); if(r) return JSON.parse(r.value); }catch(e){}
    }
    if(LS){
      try{ const v = LS.getItem(LS_PREFIX + k); if(v != null) return JSON.parse(v); }catch(e){}
    }
    return (k in _mem) ? _mem[k] : null;
  },
  async set(k,v){
    _mem[k] = v;
    const json = JSON.stringify(v);
    if(LS){
      try{ LS.setItem(LS_PREFIX + k, json); }
      catch(e){ /* p.ej. cuota llena */ }
    }
    if(HAS_WS){
      try{ await window.storage.set(k, json, false); }catch(e){}
    }
  },
  async del(k){
    delete _mem[k];
    if(LS){ try{ LS.removeItem(LS_PREFIX + k); }catch(e){} }
    if(HAS_WS){ try{ await window.storage.delete(k, false); }catch(e){} }
  },
  async list(prefix){
    const keys = new Set();
    if(HAS_WS){
      try{ const r = await window.storage.list(prefix, false); ((r&&r.keys)||[]).forEach(x=>keys.add(x)); }catch(e){}
    }
    if(LS){
      try{
        for(let i=0;i<LS.length;i++){
          const k = LS.key(i);
          if(k && k.startsWith(LS_PREFIX + prefix)) keys.add(k.slice(LS_PREFIX.length));
        }
      }catch(e){}
    }
    Object.keys(_mem).filter(x=>x.startsWith(prefix)).forEach(x=>keys.add(x));
    return [...keys];
  }
};
// Dónde estamos guardando realmente (para informar al usuario)
const STORAGE_MODE = HAS_WS ? 'claude' : (LS ? 'device' : 'memory');

/* ---------- Utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const app = $('#app');
const todayKey = ()=> new Date().toLocaleDateString('sv'); // YYYY-MM-DD
const fmtDate = (d=new Date())=> d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const r0 = n => Math.round(n);
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('toast--show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('toast--show'),2200);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Bebidas rápidas (valores aproximados, editables por entrada) ---------- */
const BEBIDAS = {
  cana: {nombre:'Caña (≈200 ml)',     kcal:90,  prot:0.7, carb:7, fat:0, icon:'🍺'},
  vino: {nombre:'Copa de vino (≈150 ml)', kcal:125, prot:0.1, carb:4, fat:0, icon:'🍷'}
};

/* ---------- Llamada a la IA (funciona dentro de Claude o instalada con tu clave) ---------- */
async function callClaude(messages){
  const key = perfil && perfil.apiKey ? perfil.apiKey.trim() : '';
  const headers = {"Content-Type":"application/json"};
  let model = "claude-sonnet-4-6"; // dentro de Claude, la clave la gestiona el entorno
  if(key){
    // Modo instalado: usas tu propia clave de Anthropic, guardada solo en tu dispositivo
    headers["x-api-key"] = key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
    model = (perfil.apiModel && perfil.apiModel.trim()) || "claude-sonnet-4-5";
  }
  const response = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers,
    body:JSON.stringify({ model, max_tokens:1500, messages })
  });
  if(!response.ok){ let d=''; try{d=await response.text();}catch(e){} throw new Error('API '+response.status+' '+d); }
  const data = await response.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function parseJSON(text){
  const clean = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  const s=clean.indexOf('{'), e=clean.lastIndexOf('}');
  return JSON.parse(clean.slice(s,e+1));
}

/* ---------- Ciencia: cálculos energéticos ---------- */
// BMR — Mifflin-St Jeor (la más validada)
function bmr(p){
  const base = 10*p.peso + 6.25*p.altura - 5*p.edad;
  return p.sexo==='h' ? base+5 : base-161;
}
const ACT = {
  sedentario:{f:1.2,  t:'Sedentario', s:'Poco o nada de ejercicio'},
  ligero:    {f:1.375,t:'Ligero',     s:'Ejercicio 1–3 días/semana'},
  moderado:  {f:1.55, t:'Moderado',   s:'Ejercicio 3–5 días/semana'},
  alto:      {f:1.725,t:'Alto',       s:'Ejercicio 6–7 días/semana'},
  muyalto:   {f:1.9,  t:'Muy alto',   s:'Trabajo físico o 2 sesiones/día'}
};
const RITMO = {
  suave:   {kcal:275, kg:0.25, t:'Suave',    s:'≈ 0,25 kg/semana'},
  moderado:{kcal:550, kg:0.5,  t:'Moderado', s:'≈ 0,5 kg/semana'},
  intenso: {kcal:825, kg:0.75, t:'Intenso',  s:'≈ 0,75 kg/semana'}
};
function tdee(p){ return bmr(p)*ACT[p.actividad].f; }
function pesoSaludable(alturaCm){
  const m=alturaCm/100;
  return { min: 18.5*m*m, max: 24.9*m*m };
}
// Objetivo calórico con SUELO de seguridad
function objetivoKcal(p){
  const gasto = tdee(p);
  const deficit = RITMO[p.ritmo].kcal;
  const suelo = p.sexo==='h' ? 1500 : 1200;
  let obj = gasto - deficit;
  let capado = false;
  if(obj < suelo){ obj = suelo; capado = true; }
  return { gasto, deficit, obj:r0(obj), suelo, capado };
}
// Macros según modo. Devuelve gramos objetivo.
function macros(p, kcalObj){
  const modo = p.macroModo||'equilibrado';
  let protG, fatG, carbG;
  if(modo==='keto'){
    protG = 1.8*p.peso;
    carbG = 30;                       // hidratos bajos fijos
    const kcalRest = kcalObj - protG*4 - carbG*4;
    fatG = Math.max(kcalRest/9, 0.8*p.peso);
  } else if(modo==='proteina'){
    protG = 2.2*p.peso;
    fatG  = (kcalObj*0.25)/9;
    carbG = Math.max((kcalObj - protG*4 - fatG*9)/4, 0);
  } else { // equilibrado
    protG = 1.8*p.peso;
    fatG  = (kcalObj*0.30)/9;
    carbG = Math.max((kcalObj - protG*4 - fatG*9)/4, 0);
  }
  return { prot:r0(protG), carb:r0(carbG), fat:r0(fatG) };
}
function computeTargets(p){
  const o = objetivoKcal(p);
  const m = macros(p, o.obj);
  return { kcal:o.obj, ...m, _calc:o };
}

/* ---------- Estado ---------- */
let perfil = null;   // {sexo,edad,peso,altura,actividad,pesoObjetivo,ritmo,macroModo,objetivos}
let dia = null;      // {fecha, entradas:[]}
let pesos = [];      // [{fecha,peso}]
let pendingEntry = null; // resultado de análisis pendiente de confirmar (o entrada en edición)
let historial = [];  // días anteriores con registros, del más reciente al más antiguo

async function loadAll(){
  perfil = await store.get('perfil');
  pesos  = (await store.get('pesos')) || [];
  const dk = 'dia:'+todayKey();
  dia = (await store.get(dk)) || {fecha:todayKey(), entradas:[]};
  await loadHistorial();
}
// Carga los últimos n días (sin contar hoy) que tengan algo registrado
async function loadHistorial(n=30){
  const out=[], base=new Date();
  for(let i=1;i<=n;i++){
    const d=new Date(base); d.setDate(base.getDate()-i);
    const v=await store.get('dia:'+d.toLocaleDateString('sv'));
    if(v && v.entradas && v.entradas.length) out.push(v);
  }
  historial=out;
}
// Si la app sigue abierta al pasar la medianoche, empieza un día nuevo
async function ensureToday(){
  if(dia.fecha===todayKey()) return false;
  dia = (await store.get('dia:'+todayKey())) || {fecha:todayKey(), entradas:[]};
  await loadHistorial();
  return true;
}
async function saveDia(){ await store.set('dia:'+dia.fecha, dia); }
async function saveProfile(){ await store.set('perfil', perfil); }
async function savePesos(){ await store.set('pesos', pesos); }

/* ---------- Totales del día ---------- */
function totales(){
  return dia.entradas.reduce((a,e)=>({
    kcal:a.kcal+(+e.kcal||0), prot:a.prot+(+e.prot||0),
    carb:a.carb+(+e.carb||0), fat:a.fat+(+e.fat||0)
  }),{kcal:0,prot:0,carb:0,fat:0});
}

/* ============================================================
   ONBOARDING
   ============================================================ */
let obData = { sexo:'h', edad:'', peso:'', altura:'', actividad:'', pesoObjetivo:'', ritmo:'', macroModo:'equilibrado' };

function renderOnboarding(){
  const editando = !!(perfil && perfil.objetivos);
  app.innerHTML = `
  <div class="ob" ${editando?'style="padding-bottom:180px"':''}>
    <div class="ob__brand">
      <div class="ob__logo">B</div>
      <div class="ob__brandname">Báscula</div>
    </div>
    <h1 class="ob__h1">Vamos a calcular tu objetivo diario</h1>
    <p class="ob__lead">Con tus datos calculo tu gasto energético real y un déficit sostenible, basado en la fórmula de Mifflin-St Jeor. Sin números peligrosos.</p>

    <div class="ob__steplabel">Tus datos</div>
    <div class="field">
      <label class="field__label">Sexo biológico <span style="font-weight:400;color:var(--ink-faint)">(para el cálculo metabólico)</span></label>
      <div class="segment" id="segSexo">
        <button class="seg ${obData.sexo==='h'?'seg--on':''}" data-v="h">Hombre</button>
        <button class="seg ${obData.sexo==='m'?'seg--on':''}" data-v="m">Mujer</button>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label class="field__label">Edad</label><input class="control num" id="fEdad" type="number" inputmode="numeric" placeholder="años" value="${esc(obData.edad)}"></div>
      <div class="field"><label class="field__label">Altura</label><input class="control num" id="fAltura" type="number" inputmode="numeric" placeholder="cm" value="${esc(obData.altura)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label class="field__label">Peso actual</label><input class="control num" id="fPeso" type="number" inputmode="decimal" placeholder="kg" value="${esc(obData.peso)}"></div>
      <div class="field"><label class="field__label">Peso objetivo</label><input class="control num" id="fObjetivo" type="number" inputmode="decimal" placeholder="kg" value="${esc(obData.pesoObjetivo)}"></div>
    </div>
    <div id="objAviso"></div>

    <div class="ob__steplabel">Actividad física</div>
    <div class="field" id="segAct">
      ${Object.entries(ACT).map(([k,v])=>`
        <button class="choicecard ${obData.actividad===k?'choicecard--on':''}" data-v="${k}">
          <span class="choicecard__t">${v.t}</span><span class="choicecard__s">${v.s}</span>
        </button>`).join('')}
    </div>

    <div class="ob__steplabel">Ritmo de pérdida</div>
    <div class="field" id="segRitmo">
      ${Object.entries(RITMO).map(([k,v])=>`
        <button class="choicecard ${obData.ritmo===k?'choicecard--on':''}" data-v="${k}">
          <span class="choicecard__t">${v.t} · ${v.s}</span>
          <span class="choicecard__s">${v.kcal} kcal de déficit al día</span>
        </button>`).join('')}
    </div>
    <div class="callout callout--teal">Un ritmo de 0,25–0,75 kg por semana es lo que respalda la evidencia para perder grasa conservando músculo. Ir más rápido casi siempre sale caro: pérdida de masa muscular, hambre y rebote.</div>

    <div class="ob__steplabel">Reparto de nutrientes</div>
    <div class="field" id="segMacro">
      <button class="choicecard ${obData.macroModo==='equilibrado'?'choicecard--on':''}" data-v="equilibrado"><span class="choicecard__t">Equilibrado</span><span class="choicecard__s">Proteína alta, grasa e hidratos repartidos</span></button>
      <button class="choicecard ${obData.macroModo==='proteina'?'choicecard--on':''}" data-v="proteina"><span class="choicecard__t">Alto en proteína</span><span class="choicecard__s">Máxima retención de músculo en déficit</span></button>
      <button class="choicecard ${obData.macroModo==='keto'?'choicecard--on':''}" data-v="keto"><span class="choicecard__t">Keto / baja en hidratos</span><span class="choicecard__s">~30 g de hidratos, grasa alta</span></button>
    </div>

    <div id="preview"></div>
  </div>
  <div class="cta">
    <button class="btn" id="btnStart" disabled>${editando?'Guardar cambios':'Calcular mi objetivo'}</button>
    ${editando?`<button class="btn btn--ghost" style="margin-top:10px" id="btnObCancel">Cancelar</button>`:''}
  </div>`;

  // eventos
  $('#segSexo').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;obData.sexo=b.dataset.v;[...e.currentTarget.children].forEach(c=>c.classList.toggle('seg--on',c===b));refreshOb();});
  bindChoice('#segAct','actividad');
  bindChoice('#segRitmo','ritmo');
  bindChoice('#segMacro','macroModo');
  ['fEdad','fAltura','fPeso','fObjetivo'].forEach(id=>{
    $('#'+id).addEventListener('input',()=>{
      obData.edad=$('#fEdad').value; obData.altura=$('#fAltura').value;
      obData.peso=$('#fPeso').value; obData.pesoObjetivo=$('#fObjetivo').value;
      refreshOb();
    });
  });
  $('#btnStart').addEventListener('click',finishOnboarding);
  if(editando) $('#btnObCancel').addEventListener('click',()=>renderApp('perfil'));
  refreshOb();
}
function bindChoice(sel,key){
  $(sel).addEventListener('click',e=>{
    const b=e.target.closest('[data-v]'); if(!b)return;
    obData[key]=b.dataset.v;
    [...$(sel).querySelectorAll('.choicecard')].forEach(c=>c.classList.toggle('choicecard--on',c===b));
    refreshOb();
  });
}
function obValid(){
  return obData.edad>0 && obData.altura>0 && obData.peso>0 && obData.pesoObjetivo>0
    && obData.actividad && obData.ritmo && obData.macroModo;
}
function refreshOb(){
  // aviso peso objetivo
  const av=$('#objAviso');
  if(av && obData.altura>0 && obData.pesoObjetivo>0){
    const {min}=pesoSaludable(+obData.altura);
    if(+obData.pesoObjetivo < min){
      av.innerHTML=`<div class="callout callout--danger">Tu peso objetivo (${obData.pesoObjetivo} kg) está por debajo del rango saludable para tu altura (mínimo ≈ ${min.toFixed(1)} kg, IMC 18,5). Te recomiendo no fijar un objetivo por debajo de ahí.</div>`;
    } else av.innerHTML='';
  } else if(av) av.innerHTML='';

  // preview del objetivo
  const pv=$('#preview');
  if(pv && obValid()){
    const p={sexo:obData.sexo,edad:+obData.edad,peso:+obData.peso,altura:+obData.altura,actividad:obData.actividad,ritmo:obData.ritmo,macroModo:obData.macroModo};
    const t=computeTargets(p);
    pv.innerHTML=`
      <div class="resultbox">
        <div class="ob__steplabel" style="margin-top:0">Tu objetivo diario</div>
        <div class="resultbox__big num">${t.kcal.toLocaleString('es-ES')} <span>kcal/día</span></div>
        <div class="minigrid">

async function finishOnboarding(){

    actividad:obData.actividad,pesoObjetivo:+obData.pesoObjetivo,ritmo:obData.ritmo,macroModo:obData.macroModo};
  p.objetivos=computeTargets(p);
  // al editar el perfil, conserva la clave y el modelo de la IA
  if(perfil){ p.apiKey=perfil.apiKey; p.apiModel=perfil.apiModel; }
  perfil=p;
  await saveProfile();
  // registra el peso si es el primero o si ha cambiado
  const ultimo=pesos[pesos.length-1];
  if(!ultimo || ultimo.peso!==p.peso){
    const ex=pesos.find(x=>x.fecha===todayKey());
    if(ex) ex.peso=p.peso; else pesos.push({fecha:todayKey(),peso:p.peso});
    await savePesos();
  }
  renderApp('hoy');
}

// Reduce la imagen para enviarla ligera a la IA
function downscale(file, maxDim, q){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let {width:w,height:h}=img;
      const scale=Math.min(1, maxDim/Math.max(w,h));
      w=Math.round(w*scale); h=Math.round(h*scale);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve(cv.toDataURL('image/jpeg',q));
    };
    img.onerror=e=>{ URL.revokeObjectURL(url); reject(e); };
    img.src=url;
  });
}

/* ---------- Llamada a la IA: análisis de foto ---------- */
async function analyzePhoto(dataUrl){
  const b64 = dataUrl.split(',')[1];
  const prompt = `Eres un nutricionista experto en estimar porciones a partir de fotos de comida. Analiza la imagen y estima el contenido nutricional.
Usa referencias visuales (tamaño del plato, cubiertos, envases) para calcular las porciones de forma realista.
Devuelve EXCLUSIVAMENTE un objeto JSON válido, sin markdown, sin explicación, con esta forma exacta:
{"plato":"nombre corto del plato en español","alimentos":[{"nombre":"...","porcion":"p.ej. 150 g","kcal":0,"prot":0,"carb":0,"fat":0}],"total":{"kcal":0,"prot":0,"carb":0,"fat":0},"confianza":"alta|media|baja","nota":"máx 12 palabras"}
Reglas: valores numéricos sin unidades (gramos y kcal). Si NO ves comida, pon total a 0 y explica en "nota". Sé realista, ni optimista ni exagerado.`;

  const text = await callClaude([{role:"user",content:[
    {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
    {type:"text",text:prompt}
  ]}]);
  return parseJSON(text);
}

// Genera una miniatura pequeña a partir de un dataURL (ahorra espacio de guardado)
function makeThumb(dataUrl, size, q){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, size/Math.max(img.width,img.height));
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve(cv.toDataURL('image/jpeg',q));
    };
    img.onerror=reject; img.src=dataUrl;
  });
}

  $('#s-sug').innerHTML=`
    <div class="topbar"><div class="topbar__title">Ideas para completar</div></div>
    <p style="color:var(--ink-soft);font-size:.95rem;margin:2px 2px 0">Según lo que te queda hoy, te propongo platos que encajan en tus calorías y macros restantes.</p>
    <div id="sugStage" style="margin-top:16px"></div>
    <button class="btn" style="margin-top:4px" id="btnSug">Sugerir comidas para lo que me falta</button>`;
  $('#btnSug').addEventListener('click',fetchSuggestions);
}
let _sugs=[];
async function fetchSuggestions(){
  await ensureToday();
  const t=perfil.objetivos, c=totales();
  const rest={kcal:r0(t.kcal-c.kcal),prot:r0(t.prot-c.prot),carb:r0(t.carb-c.carb),fat:r0(t.fat-c.fat)};
  const stage=$('#sugStage');
  if(rest.kcal<=50){
    stage.innerHTML=`<div class="callout callout--teal">Ya has cubierto tu objetivo de hoy (o casi). No necesitas añadir más — descansa y nos vemos mañana.</div>`;
    return;
  }
  stage.innerHTML=`<div class="analyzing"><span class="spinner"></span> Buscando ideas que encajen…</div>`;
  try{
    const sugs=await suggestMeals(rest);
    _sugs=sugs;
    stage.innerHTML=`
      <div class="callout callout--teal" style="margin-top:0">Te faltan por cubrir: <b class="num">${rest.kcal}</b> kcal · <b class="num">${rest.prot}</b> g proteína · <b class="num">${rest.carb}</b> g hidratos · <b class="num">${rest.fat}</b> g grasa</div>
      ${sugs.map((s,i)=>`
        <div class="sugcard">
          <div class="sugcard__t">${esc(s.nombre)}</div>
          <div class="sugcard__d">${esc(s.descripcion||'')}</div>
          <div class="sugcard__tags">
            <span class="tag tag--kcal num">${r0(s.kcal)} kcal</span>
            <span class="tag num">P ${r0(s.prot)}g</span>
            <span class="tag num">H ${r0(s.carb)}g</span>
            <span class="tag num">G ${r0(s.fat)}g</span>
          </div>
          <button class="btn btn--sm btn--ghost sugcard__add" data-sug="${i}">Me lo he comido · añadir al día</button>
        </div>`).join('')}
      <div class="aiwarn">Ideas orientativas generadas por IA. Ajusta las cantidades a tu gusto y a lo que tengas en casa.</div>`;
    stage.querySelectorAll('[data-sug]').forEach(b=>b.addEventListener('click',()=>addSugerencia(+b.dataset.sug)));
  }catch(err){
    stage.innerHTML=`<div class="callout callout--danger">No he podido generar ideas ahora mismo (sin conexión o error). Inténtalo de nuevo en un momento.</div>`;
  }
}
async function addSugerencia(i){
  const s=_sugs[i]; if(!s) return;
  await ensureToday();
  dia.entradas.push({id:'e'+Date.now(),nombre:s.nombre||'Comida',img:null,
    kcal:+s.kcal||0,prot:+s.prot||0,carb:+s.carb||0,fat:+s.fat||0});
  await saveDia();
  renderHoy(); renderAdd(); renderSug(); switchTab('hoy');
  toast(`${s.nombre} añadida (+${r0(s.kcal)} kcal)`);
}
async function suggestMeals(rest){
  const modo=perfil.macroModo;
  const modoTxt = modo==='keto'?' Prioriza opciones bajas en hidratos (keto).':modo==='proteina'?' Prioriza opciones ricas en proteína.':'';
  const prompt=`Actúa como nutricionista. Un usuario en déficit calórico necesita completar su día. Le quedan aproximadamente: ${rest.kcal} kcal, ${rest.prot} g de proteína, ${rest.carb} g de hidratos y ${rest.fat} g de grasa.${modoTxt}
Sugiere 3 opciones de comida realistas, sencillas de preparar y con ingredientes habituales en España, que en conjunto se acerquen a esos macros (cada opción es una alternativa, no se suman).
Devuelve EXCLUSIVAMENTE JSON válido, sin markdown:
{"sugerencias":[{"nombre":"...","descripcion":"1 frase con ingredientes principales","kcal":0,"prot":0,"carb":0,"fat":0}]}`;
  const text = await callClaude([{role:"user",content:prompt}]);
  return parseJSON(text).sugerencias||[];
}

/* ---------- Pantalla PROGRESO ---------- */
function renderProg(){
  const {min,max}=pesoSaludable(perfil.altura);
  const actual = pesos.length?pesos[pesos.length-1].peso:perfil.peso;
  const restante = (actual-perfil.pesoObjetivo);
  $('#s-prog').innerHTML=`
    <div class="topbar"><div class="topbar__title">Progreso</div></div>
    ${semanaHTML()}
    <div class="card">
      <div class="card__t">Evolución del peso</div>
      <canvas id="weightChart"></canvas>
      <div class="kv"><span class="kv__k">Peso actual</span><span class="kv__v num">${actual} kg</span></div>
      <div class="kv"><span class="kv__k">Objetivo</span><span class="kv__v num">${perfil.pesoObjetivo} kg</span></div>
      <div class="kv"><span class="kv__k">${restante>0?'Te falta bajar':'Objetivo alcanzado'}</span><span class="kv__v num">${restante>0?restante.toFixed(1)+' kg':'🎉'}</span></div>
      <div class="kv"><span class="kv__k">Rango saludable (IMC)</span><span class="kv__v num">${min.toFixed(0)}–${max.toFixed(0)} kg</span></div>
    </div>
    <div class="card">
      <div class="card__t">Registrar peso de hoy</div>
      <div class="weighrow">
        <input class="control num" id="wInput" type="number" inputmode="decimal" placeholder="kg" value="${actual}">
        <button class="btn btn--sm" id="wSave">Guardar</button>
      </div>
      <div class="field__hint">Pésate 1 vez por semana, en ayunas y siempre en las mismas condiciones. El peso diario fluctúa por agua y no refleja grasa.</div>
    </div>`;
  $('#wSave').addEventListener('click',saveWeight);
  drawChart();
}
// Calorías de los últimos 7 días frente al objetivo
function semanaHTML(){
  const obj=perfil.objetivos.kcal;
  const porFecha={}; historial.forEach(d=>porFecha[d.fecha]=d);
  porFecha[dia.fecha]=dia;
  const dias=[], base=new Date();
  for(let i=6;i>=0;i--){
    const d=new Date(base); d.setDate(base.getDate()-i);
    const k=d.toLocaleDateString('sv');
    const reg=porFecha[k];
    const kcal=reg?reg.entradas.reduce((a,e)=>a+(+e.kcal||0),0):0;
    dias.push({k,kcal,hay:!!(reg&&reg.entradas.length),hoy:i===0,
      lab:d.toLocaleDateString('es-ES',{weekday:'short'}).replace('.','')});
  }
  const top=Math.max(obj*1.25, ...dias.map(d=>d.kcal));
  const reg=dias.filter(d=>d.hay);
  const media=reg.length?r0(reg.reduce((a,d)=>a+d.kcal,0)/reg.length):0;
  const dentro=reg.filter(d=>d.kcal<=obj).length;
  return `<div class="card">
    <div class="card__t">Últimos 7 días</div>
    <div class="week__bars">
      <div class="week__goal" style="bottom:${obj/top*100}%"></div>
      ${dias.map(d=>{
        const cls=!d.hay?'week__bar--empty':d.kcal>obj?'week__bar--over':d.kcal>=obj*0.9?'week__bar--warn':'';
        const h=d.hay?Math.max(d.kcal/top*100,3):3;
        return `<div class="week__col" title="${d.k}: ${r0(d.kcal)} kcal"><div class="week__bar ${cls}" style="height:${h}%"></div></div>`;
      }).join('')}
    </div>
    <div class="week__labels">
      ${dias.map(d=>`<div class="week__lab num ${d.hoy?'week__lab--today':''}"><b>${d.hoy?'hoy':esc(d.lab)}</b>${d.hay?r0(d.kcal):'–'}</div>`).join('')}
    </div>
    ${reg.length
      ? `<div class="kv"><span class="kv__k">Media de los días registrados</span><span class="kv__v num">${media.toLocaleString('es-ES')} kcal</span></div>
         <div class="kv"><span class="kv__k">Días dentro del objetivo</span><span class="kv__v num">${dentro} de ${reg.length}</span></div>`
      : `<div class="chartempty">Aún no hay días registrados</div>`}
  </div>`;
}
async function saveWeight(){
  const v=+$('#wInput').value;
  if(!v||v<20||v>400){toast('Introduce un peso válido');return;}
  const fk=todayKey();
  const ex=pesos.find(p=>p.fecha===fk);
  if(ex) ex.peso=v; else pesos.push({fecha:fk,peso:v});
  pesos.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  perfil.peso=v;
  perfil.objetivos=computeTargets(perfil); // recalcula objetivo con el nuevo peso
  await savePesos(); await saveProfile();
  toast('Peso guardado · objetivo actualizado');
  renderProg(); renderHoy(); renderPerfil();
}
function drawChart(){
  const cv=$('#weightChart'); if(!cv) return;
  const ratio=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*ratio; cv.height=h*ratio;
  const ctx=cv.getContext('2d'); ctx.scale(ratio,ratio);
  ctx.clearRect(0,0,w,h);
  if(pesos.length<2){
    ctx.fillStyle='#8A938E'; ctx.font='13px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText('Registra tu peso al menos 2 veces para ver la tendencia',w/2,h/2);
    return;
  }
  const pad={l:34,r:12,t:14,b:20};
  const vals=pesos.map(p=>p.peso).concat([perfil.pesoObjetivo]);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  const rng=(mx-mn)||1; mn-=rng*0.15; mx+=rng*0.15;
  const X=i=>pad.l+(w-pad.l-pad.r)*(i/(pesos.length-1));
  const Y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-mn)/(mx-mn));
  // línea objetivo
  ctx.strokeStyle='#E39A2E'; ctx.setLineDash([5,4]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(pad.l,Y(perfil.pesoObjetivo)); ctx.lineTo(w-pad.r,Y(perfil.pesoObjetivo)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#BE7C15'; ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='left';
  ctx.fillText('objetivo '+perfil.pesoObjetivo+'kg',pad.l+2,Y(perfil.pesoObjetivo)-4);
  // línea peso
  ctx.strokeStyle='#12564C'; ctx.lineWidth=2.5; ctx.lineJoin='round';
  ctx.beginPath(); pesos.forEach((p,i)=>{ i?ctx.lineTo(X(i),Y(p.peso)):ctx.moveTo(X(i),Y(p.peso)); }); ctx.stroke();
  // puntos
  ctx.fillStyle='#12564C';
  pesos.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(X(i),Y(p.peso),3.5,0,7); ctx.fill(); });
  // ejes min/max
  ctx.fillStyle='#8A938E'; ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='right';
  ctx.fillText(mx.toFixed(0),pad.l-6,Y(mx)+3);
  ctx.fillText(mn.toFixed(0),pad.l-6,Y(mn)+3);
}

/* ---------- Pantalla PERFIL ---------- */
function renderPerfil(){
  const t=perfil.objetivos;
  const modoT={equilibrado:'Equilibrado',proteina:'Alto en proteína',keto:'Keto / baja en hidratos'}[perfil.macroModo];
  $('#s-perfil').innerHTML=`
    <div class="topbar"><div class="topbar__title">Perfil</div></div>
    <div class="card">
      <div class="card__t">Tu objetivo diario</div>
      <div class="kv"><span class="kv__k">Calorías</span><span class="kv__v num">${t.kcal} kcal</span></div>
      <div class="kv"><span class="kv__k">Proteína</span><span class="kv__v num">${t.prot} g</span></div>
      <div class="kv"><span class="kv__k">Hidratos</span><span class="kv__v num">${t.carb} g</span></div>
      <div class="kv"><span class="kv__k">Grasa</span><span class="kv__v num">${t.fat} g</span></div>
      <div class="kv"><span class="kv__k">Gasto estimado (TDEE)</span><span class="kv__v num">${r0(t._calc.gasto)} kcal</span></div>
      <div class="kv"><span class="kv__k">Déficit</span><span class="kv__v num">−${t._calc.deficit} kcal</span></div>
    </div>
    <div class="card">
      <div class="card__t">Tus datos</div>
      <div class="kv"><span class="kv__k">Sexo / Edad</span><span class="kv__v">${perfil.sexo==='h'?'Hombre':'Mujer'} · ${perfil.edad}</span></div>
      <div class="kv"><span class="kv__k">Altura</span><span class="kv__v num">${perfil.altura} cm</span></div>
      <div class="kv"><span class="kv__k">Actividad</span><span class="kv__v">${ACT[perfil.actividad].t}</span></div>
      <div class="kv"><span class="kv__k">Ritmo</span><span class="kv__v">${RITMO[perfil.ritmo].t} (${RITMO[perfil.ritmo].s})</span></div>
      <div class="kv"><span class="kv__k">Reparto</span><span class="kv__v">${modoT}</span></div>
    </div>
    <div class="card">
      <div class="card__t">Guardado de datos</div>
      ${STORAGE_MODE==='device'
        ? `<p style="font-size:.9rem;color:var(--ink-soft);margin:0;line-height:1.5">✅ Tus datos se guardan <b>en este dispositivo</b> y se conservan aunque cierres la app o apagues el móvil.</p>`
        : STORAGE_MODE==='claude'
        ? `<p style="font-size:.9rem;color:var(--ink-soft);margin:0;line-height:1.5">✅ Tus datos se guardan <b>en tu espacio de Claude</b> entre sesiones. Para tenerlos siempre en el móvil, instala la app: Compartir → Añadir a pantalla de inicio.</p>`
        : `<p style="font-size:.9rem;color:#8F291F;margin:0;line-height:1.5">⚠️ En este entorno los datos solo se mantienen mientras la app esté abierta. Instálala en tu iPhone (Safari → Compartir → <b>Añadir a pantalla de inicio</b>) para que se guarden de verdad.</p>`}
    </div>

    <div class="card">
      <div class="card__t">IA para el análisis de fotos</div>
      <p style="font-size:.86rem;color:var(--ink-soft);margin:0 0 12px;line-height:1.5">Dentro de Claude funciona sola. Si la instalas en tu iPhone (pantalla de inicio), pega aquí tu clave de Anthropic para que el análisis por foto y las ideas sigan funcionando. <b>La clave se guarda solo en tu dispositivo.</b></p>
      <label class="field__label">Clave API de Anthropic <span style="font-weight:400;color:var(--ink-faint)">(opcional)</span></label>
      <input class="control" id="apiKey" type="password" placeholder="sk-ant-..." value="${esc(perfil.apiKey||'')}" autocomplete="off">
      <label class="field__label" style="margin-top:12px">Modelo</label>
      <input class="control" id="apiModel" placeholder="claude-sonnet-4-5" value="${esc(perfil.apiModel||'')}">
      <div class="field__hint">Consulta los modelos disponibles en docs.claude.com. Déjalo vacío para usar el valor por defecto.</div>
      <button class="btn btn--sm" style="width:100%;margin-top:14px" id="saveApi">Guardar clave</button>
    </div>

    <button class="btn btn--ghost" id="btnEdit">Editar mis datos y objetivo</button>
    <button class="btn btn--danger-ghost" style="margin-top:10px" id="btnReset">Empezar de cero</button>
    <div class="aiwarn" style="margin-top:16px">Esta app es una herramienta de apoyo, no un consejo médico. Si tienes alguna condición de salud o tomas medicación, contrasta tu plan con un profesional sanitario.</div>`;
  $('#saveApi').addEventListener('click',async()=>{
    perfil.apiKey=$('#apiKey').value.trim();
    perfil.apiModel=$('#apiModel').value.trim();
    await saveProfile();
    toast(perfil.apiKey?'Clave guardada en este dispositivo':'Clave eliminada');
  });
  $('#btnEdit').addEventListener('click',()=>{
    obData={sexo:perfil.sexo,edad:perfil.edad,peso:perfil.peso,altura:perfil.altura,actividad:perfil.actividad,pesoObjetivo:perfil.pesoObjetivo,ritmo:perfil.ritmo,macroModo:perfil.macroModo};
    renderOnboarding();
  });
  $('#btnReset').addEventListener('click',async()=>{
    if(confirm('¿Seguro? Se borrarán tu perfil y tu historial.')){
      const keys=await store.list('dia:'); for(const k of keys) await store.del(k);
      await store.del('perfil'); await store.del('pesos');
      perfil=null;pesos=[];historial=[];dia={fecha:todayKey(),entradas:[]};
      obData={sexo:'h',edad:'',peso:'',altura:'',actividad:'',pesoObjetivo:'',ritmo:'',macroModo:'equilibrado'};
      renderOnboarding();
    }
  });
}

/* ---------- Arranque ---------- */
(async function init(){
  await loadAll();
  if(perfil && perfil.objetivos) renderApp('hoy');
  else renderOnboarding();
})();
// Al volver a la app (p. ej. a la mañana siguiente), pasa al día nuevo
document.addEventListener('visibilitychange', async()=>{
  if(document.visibilityState!=='visible' || !dia || !$('#s-hoy')) return;
  if(await ensureToday()) renderApp(currentTab);
});
</script>
</body>
</html>
